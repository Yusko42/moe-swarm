# Тестовый стенд: инициатор (llama-server) и N исполнителей (ggml-rpc-server).

name: moe-swarm-stand

x-llama: &llama
  build:
    context: .
  image: moe-swarm/llama-stand:b12110
  init: true

services:
  worker:
    <<: *llama
    # Вывод фильтруется: убираются строки о каждом коротком подключении
    # (llama.cpp открывает их десятками при загрузке). Ошибки остаются.
    # exec — чтобы сигналы остановки получал сам ggml-rpc-server.
    entrypoint: ["bash", "-c"]
    command:
      - >-
        exec ggml-rpc-server --host 0.0.0.0 --port 50052 --threads ${WORKER_THREADS:-2}
        > >(grep --line-buffered -vxE 'Accepted client connection|Client connection closed|recv returned 0 \(peer closed\?\)') 2>&1
    deploy:
      replicas: ${WORKERS:-2}
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2}"
          memory: ${WORKER_MEMORY:-4g}

  initiator:
    <<: *llama
    entrypoint: ["stand-entrypoint"]
    command: ["llama-server"]
    environment:
      MODEL: ${MODEL:-}
      WORKERS: ${WORKERS:-2}
      LLAMA_ARG_THREADS: ${INITIATOR_THREADS:-2}
      # Предел диалога 8 тыс. токенов (ФТ-7).
      LLAMA_ARG_CTX_SIZE: "8192"
      # Один ответ за раз, остальные запросы ждут в очереди (ФТ-7).
      LLAMA_ARG_N_PARALLEL: "1"
      # Раскладка: 32 слоя на соседей, поровну между двумя (-ngl 32 -ts 1,1).
      LLAMA_ARG_N_GPU_LAYERS: "32"
      LLAMA_ARG_TENSOR_SPLIT: "1,1"
      # Без mmap: веса читаются в память целиком (-lm none).
      LLAMA_ARG_LOAD_MODE: none
      # Без кэша промптов: --no-cache-prompt и --cache-ram 0.
      LLAMA_ARG_CACHE_PROMPT: "false"
      LLAMA_ARG_CACHE_RAM: "0"
      # Режим размышлений Qwen3 выключен (-rea off).
      LLAMA_ARG_REASONING: "off"
      # Уровень trace (-lv 4): без него не видно раскладки слоёв и памяти по устройствам.
      LLAMA_ARG_LOG_VERBOSITY: "4"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
    volumes:
      # z — метка SELinux, без неё контейнер не может читать каталог (Fedora/RHEL, Podman).
      # MODELS_DIR — другой каталог с моделями; models/ может быть и симлинком.
      - ${MODELS_DIR:-../../models}:/models:ro,z
    ports:
      - "${PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: "${INITIATOR_CPUS:-2}"
          memory: ${INITIATOR_MEMORY:-4g}
